name: ShopRank CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Unit / Ranking Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Full Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest -v tests/

  validate-deployment:
    name: Validate Manifests & Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f deploy/docker-compose.yml config

      - name: Validate Kubernetes YAML Manifests
        run: |
          python -c "
          import yaml, glob
          for f in glob.glob('deploy/k8s/*.yaml') + glob.glob('deploy/prometheus/*.yml'):
              with open(f, 'r') as fp:
                  list(yaml.safe_load_all(fp))
              print(f'Validated: {f}')
          "

  build-and-push:
    name: Container Build & Push
    needs: [test, validate-deployment]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    name: CD Smoke Test on Kind Cluster
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Kind Cluster
        uses: helm/kind-action@v1.9.0
        with:
          cluster_name: shoprank-cluster

      - name: Deploy Kubernetes Manifests
        run: |
          kubectl create namespace shoprank --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f deploy/k8s/champion.yaml
          kubectl apply -f deploy/k8s/challenger.yaml
          kubectl apply -f deploy/k8s/router.yaml

      - name: Verify Deployment Rollouts
        run: |
          kubectl rollout status deployment/shoprank-champion -n shoprank --timeout=120s || true
          kubectl rollout status deployment/shoprank-router -n shoprank --timeout=120s || true
