[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shoprank"
version = "0.1.0"
description = "ShopRank: Two-Stage Recommender System with Production Serving and Safe Rollout"
authors = [{ name = "ShopRank Team" }]
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
