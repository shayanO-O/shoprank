apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoprank-challenger
  namespace: shoprank
  labels:
    app: shoprank-challenger
    role: challenger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shoprank-challenger
  template:
    metadata:
      labels:
        app: shoprank-challenger
        role: challenger
    spec:
      containers:
        - name: shoprank-serving
          image: ghcr.io/shayano-o/shoprank:latest
          command: ["uvicorn", "src.serving.app:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: MODEL_VERSION
              value: "challenger"
            - name: PORT
              value: "8001"
            - name: REDIS_URL
              value: "redis://shoprank-redis:6379/0"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: shoprank-challenger
  namespace: shoprank
  labels:
    app: shoprank-challenger
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      name: http
  selector:
    app: shoprank-challenger
