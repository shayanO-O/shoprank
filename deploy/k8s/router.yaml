apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoprank-router
  namespace: shoprank
  labels:
    app: shoprank-router
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shoprank-router
  template:
    metadata:
      labels:
        app: shoprank-router
    spec:
      containers:
        - name: router
          image: ghcr.io/shayano-o/shoprank:latest
          command: ["uvicorn", "src.serving.router:router_app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: CHAMPION_URL
              value: "http://shoprank-champion.shoprank.svc.cluster.local:8000"
            - name: CHALLENGER_URL
              value: "http://shoprank-challenger.shoprank.svc.cluster.local:8001"
            - name: CANARY_WEIGHT
              value: "10"
            - name: SHADOW_ENABLED
              value: "true"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: shoprank-router
  namespace: shoprank
  labels:
    app: shoprank-router
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8080
      name: http
  selector:
    app: shoprank-router
